<!DOCTYPE html>
<html>
<head>
    <title>测试本地存储</title>
</head>
<body>
    <h1>任务数据测试</h1>
    <div id="test-results"></div>
    <script>
        function log(message) {
            const results = document.getElementById('test-results');
            results.innerHTML += '<p>' + message + '</p>';
            console.log(message);
        }

        log('=== 测试开始 ===');

        // 检查 localStorage 可用性
        try {
            localStorage.setItem('test', 'test');
            localStorage.removeItem('test');
            log('localStorage 可用');
        } catch (e) {
            log('localStorage 不可用: ' + e.message);
        }

        // 检查当前任务数据
        log('\n=== 当前任务数据 ===');
        const tasks = localStorage.getItem('tasks');
        log('本地存储中的任务: ' + tasks);

        if (tasks) {
            try {
                const parsed = JSON.parse(tasks);
                log('解析后的任务数量: ' + parsed.length);
                log('任务列表: ' + JSON.stringify(parsed, null, 2));
            } catch (e) {
                log('解析失败: ' + e.message);
            }
        } else {
            log('本地存储中没有任务数据');
        }

        // 测试添加任务
        log('\n=== 测试添加任务 ===');
        const testTask = {
            id: Date.now(),
            title: '测试任务',
            completed: false,
            dueDate: '2026-04-25',
            priority: 'medium'
        };

        const currentTasks = tasks ? JSON.parse(tasks) : [];
        currentTasks.push(testTask);
        
        try {
            localStorage.setItem('tasks', JSON.stringify(currentTasks));
            log('添加测试任务成功');
            log('添加后的任务数量: ' + currentTasks.length);
        } catch (e) {
            log('保存失败: ' + e.message);
        }

        // 测试读取
        log('\n=== 测试读取 ===');
        const updatedTasks = localStorage.getItem('tasks');
        if (updatedTasks) {
            try {
                const parsed = JSON.parse(updatedTasks);
                log('读取到的任务数量: ' + parsed.length);
            } catch (e) {
                log('读取失败: ' + e.message);
            }
        }

        // 测试 localStorage 容量
        log('\n=== 测试 localStorage 容量 ===');
        let testData = 'a';
        try {
            while (true) {
                localStorage.setItem('test', testData);
                testData += testData;
            }
        } catch (e) {
            log('localStorage 容量: ' + testData.length / 2 + ' 字符');
            localStorage.removeItem('test');
        }

        log('\n=== 测试结束 ===');
    </script>
</body>
</html>
